[project]
name = "torch-foundry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.66",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.16",
]
notebooks = [
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
